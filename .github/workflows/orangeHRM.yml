name: Playwright Automation

on:

  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # 7:30 PM IST
    - cron: "0 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  automation:

    runs-on: ubuntu-latest

    timeout-minutes: 40

    strategy:

      fail-fast: false

      matrix:

        browser:

          - chromium
          - firefox
          - webkit

    steps:

      ####################################################
      # Checkout
      ####################################################

      - uses: actions/checkout@v4

      ####################################################
      # Java
      ####################################################

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      ####################################################
      # Cache Playwright Browsers
      ####################################################

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            playwright-${{ runner.os }}

      ####################################################
      # Install Browsers
      ####################################################

      - name: Install Playwright Browsers
        run: |
            mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      ####################################################
      # Execute Tests
      ####################################################

      - name: Execute Tests
        run: |
          mvn clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true

      ####################################################
      # Retry Failed Scenarios
      ####################################################

      - name: Retry Failed Scenarios
        if: always()
        run: |
          if [ -f target/failedrerun.txt ] && [ -s target/failedrerun.txt ]; then
            mvn test \
            -Dtest=FailedRunner \
            -Dbrowser=${{ matrix.browser }}
          else
            echo "No failed scenarios."
          fi

      ####################################################
      # Upload Complete Execution Folder
      ####################################################

      - name: Upload Test Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestOutput-${{ matrix.browser }}
          path: test-output/

      ####################################################
      # Publish ONLY Chromium Report
      ####################################################

      - name: Upload GitHub Pages Artifact
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-output/latest

  deploy:

    needs: automation

    runs-on: ubuntu-latest

    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - id: deployment
        uses: actions/deploy-pages@v4