name: Playwright Automation

on:

  push:
    branches:
      - main

  pull_request:

workflow_dispatch:

  inputs:

    browser:

      description: Browser

      required: true

      default: chromium

      type: choice

      options:

        - chromium

        - firefox

        - webkit
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  automation:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:

      fail-fast: false

      matrix:

        browser:

          - chromium
          - firefox
          - webkit

    steps:

      ############################################################
      # Checkout
      ############################################################

      - uses: actions/checkout@v4

      ############################################################
      # Java
      ############################################################

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17

          cache: maven

      ############################################################
      # Cache Playwright Browsers
      ############################################################

      - uses: actions/cache@v4

        with:

          path: ~/.cache/ms-playwright

          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      ############################################################
      # Install Browsers
      ############################################################

      - name: Install Browsers

        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      ############################################################
      # Main Suite
      ############################################################

      - name: Execute Main Suite

        run: |

          mvn clean test -Dbrowser=${{ matrix.browser }}

      ############################################################
      # Retry Failed Scenarios
      ############################################################

      - name: Retry Failed Scenarios

        if: always()

        run: |

          if [ -f target/failed_scenarios.txt ] && [ -s target/failed_scenarios.txt ]
          then
            echo "Retrying failed scenarios..."
            mvn test -Dtest=FailureRunner -Dbrowser=${{ matrix.browser }}
          else
            echo "No failed scenarios."
          fi

      ############################################################
      # Upload Report
      ############################################################

      - uses: actions/upload-artifact@v4

        if: always()

        with:

          name: ExtentReport-${{ matrix.browser }}

          path: extent-test-output/

      ############################################################
      # Upload Logs
      ############################################################

      - uses: actions/upload-artifact@v4

        if: always()

        with:

          name: Logs-${{ matrix.browser }}

          path: logs/

      ############################################################
      # Upload Screenshots
      ############################################################

      - uses: actions/upload-artifact@v4

        if: always()

        with:

          name: Screenshots-${{ matrix.browser }}

          path: screenshots/

      ############################################################
      # Upload Failure Artifacts
      ############################################################

      - uses: actions/upload-artifact@v4

        if: failure()

        with:

          name: Trace-${{ matrix.browser }}

          path: traces/

      - uses: actions/upload-artifact@v4

        if: failure()

        with:

          name: Videos-${{ matrix.browser }}

          path: videos/

      - uses: actions/upload-artifact@v4

        if: failure()

        with:

          name: HAR-${{ matrix.browser }}

          path: har/

      ############################################################
      # GitHub Pages
      ############################################################

      - name: Upload Pages Artifact

        if: always()

        uses: actions/upload-pages-artifact@v3

        with:

          path: extent-test-output/

  deploy:

    needs: automation

    runs-on: ubuntu-latest

    if: always()

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - id: deployment

        uses: actions/deploy-pages@v4